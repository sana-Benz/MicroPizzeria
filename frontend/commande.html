<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Commander | La Micro Pizzeria</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="order-header">
            <h1>La <span>Micro</span> Pizzeria</h1>
        </header>
        <div class="page-tools">
            <button type="button" id="back-btn">Retour page precedente</button>
            <button type="button" id="home-btn">Retour accueil</button>
            <button type="button" id="track-order-btn">Suivi de commande</button>
        </div>

        <main class="order-page">
            <section class="order-section">
                <p class="mini-title">Nos specialites</p>
                <h2>Nos Pizzas</h2>
                <div class="order-grid" id="pizza-grid">
                    <p class="loading">Chargement...</p>
                </div>
            </section>

            <section class="order-section">
                <p class="mini-title">Pour accompagner</p>
                <h2>Nos boissons</h2>
                <div class="order-grid" id="drink-grid">
                    <p class="loading">Chargement...</p>
                </div>
            </section>

            <section class="order-section">
                <p class="mini-title">La touche sucree</p>
                <h2>Nos desserts</h2>
                <div class="order-grid" id="dessert-grid">
                    <p class="loading">Chargement...</p>
                </div>
            </section>

            <div class="order-submit">
                <button type="button" id="go-to-summary-btn">Valider la commande</button>
            </div>
        </main>

        <script>
            const API_BASE = '';
            const CART_KEY = "microPizzeriaCart";
            const CUSTOMER_KEY = "microPizzeriaCustomer";
            const ORDER_STATUS_KEY = "microPizzeriaOrderStatus";
            const ORDER_CONFIRMED_AT_KEY = "microPizzeriaOrderConfirmedAt";

            const IMAGE_MAP = {
                'Margherita':              'images/menu_items/pizza_margharita.jpeg',
                'Pepperoni':               'images/menu_items/pizza_peperoni.jpeg',
                'Végétarienne':            'images/menu_items/pizza_vegetarian.jpg',
                'Fruits de mer':           'images/menu_items/pizza_seafood.jpg',
                'Bœuf':                    'images/menu_items/pizza_beef.jpg',
                'Poulet':                  'images/menu_items/pizza_chicken.jpg',
                'Neptune':                 'images/menu_items/pizza_neptune.png',
                'Eau minérale':            'images/menu_items/drinks_water.webp',
                'Cola':                    'images/menu_items/drinks_cola.webp',
                'Sprite':                  'images/menu_items/drinks_sprite.jpeg',
                'Ice Tea':                 'images/menu_items/drinks_icetea.png',
                'Eau gazeuse':             'images/menu_items/drinks_sparklingwater.webp',
                'Tiramisu':                'images/menu_items/dessert_tiramisu.jpg',
                'Cheesecake':              'images/menu_items/desserts_cheesecake.jpg',
                'Cannoli':                 'images/menu_items/dessert_cannoli.jpg',
                'Panna Cotta':             'images/menu_items/dessert_pannacotta.webp',
                'Crostata à la confiture': 'images/menu_items/dessert_crostata.jpg',
            };

            function getCart() {
                return JSON.parse(localStorage.getItem(CART_KEY) || "[]");
            }

            function saveCart(cart) {
                localStorage.setItem(CART_KEY, JSON.stringify(cart));
            }

            function hasCustomerInfo() {
                return Boolean(localStorage.getItem(CUSTOMER_KEY));
            }

            function getOrderStatus() {
                const status = localStorage.getItem(ORDER_STATUS_KEY);
                const confirmedAt = Number(localStorage.getItem(ORDER_CONFIRMED_AT_KEY) || 0);
                if (status === "en_cours" && confirmedAt > 0 && Date.now() - confirmedAt > 60000) {
                    localStorage.setItem(ORDER_STATUS_KEY, "livree");
                    return "livree";
                }
                return status || "en_cours";
            }

            function upsertItem(id, name, unitPrice, quantity) {
                const cart = getCart().filter((item) => item.quantity > 0);
                const index = cart.findIndex((item) => item.name === name);
                if (quantity > 0) {
                    const nextItem = { id, name, unitPrice, quantity };
                    if (index >= 0) {
                        cart[index] = nextItem;
                    } else {
                        cart.push(nextItem);
                    }
                } else if (index >= 0) {
                    cart.splice(index, 1);
                }
                saveCart(cart);
            }

            function createCard(item) {
                const cart = getCart();
                const existing = cart.find((c) => c.name === item.name);
                const currentQty = existing ? existing.quantity : 0;

                const article = document.createElement('article');
                article.className = 'order-card';
                article.dataset.id = item.id;
                article.dataset.name = item.name;
                article.dataset.price = item.price;

                const imgSrc = IMAGE_MAP[item.name] || 'images/menu_items/pizza_margharita.jpeg';

                article.innerHTML = `
                    <img src="${imgSrc}" alt="${item.name}">
                    <h3>${item.name}</h3>
                    <p class="description">${item.description}</p>
                    <p class="price">${item.price}€</p>
                    <div class="quantity-row">
                        <input type="number" min="0" value="${currentQty}" aria-label="Quantite ${item.name}">
                        <button type="button" class="validate-item-btn">Valider la quantite</button>
                    </div>
                    <p class="item-status" aria-live="polite">${currentQty > 0 ? 'Quantite deja enregistree' : ''}</p>
                `;

                article.querySelector('.validate-item-btn').addEventListener('click', function () {
                    const input = article.querySelector('input[type="number"]');
                    const status = article.querySelector('.item-status');
                    const quantity = Math.max(0, Number(input.value) || 0);
                    input.value = quantity;
                    upsertItem(item.id, item.name, item.price, quantity);
                    status.textContent = quantity > 0 ? 'Quantite validee' : 'Produit retire de la commande';
                });

                return article;
            }

            async function loadMenu() {
                try {
                    const response = await fetch(`${API_BASE}/api/menu`);
                    if (!response.ok) throw new Error();
                    const items = await response.json();

                    const grids = {
                        pizza:   document.getElementById('pizza-grid'),
                        drink:   document.getElementById('drink-grid'),
                        dessert: document.getElementById('dessert-grid'),
                    };

                    Object.values(grids).forEach((g) => (g.innerHTML = ''));

                    items.forEach((item) => {
                        const grid = grids[item.category];
                        if (grid) grid.appendChild(createCard(item));
                    });
                } catch {
                    document.querySelector('.order-page').innerHTML =
                        '<p style="color:red;text-align:center;padding:2rem;">Impossible de charger le menu. Veuillez reessayer.</p>';
                }
            }

            document.getElementById('go-to-summary-btn').addEventListener('click', function () {
                document.querySelectorAll('.order-card').forEach((card) => {
                    const id = Number(card.dataset.id);
                    const name = card.dataset.name;
                    const unitPrice = Number(card.dataset.price);
                    const input = card.querySelector('input[type="number"]');
                    const quantity = Math.max(0, Number(input.value) || 0);
                    upsertItem(id, name, unitPrice, quantity);
                });

                const cart = getCart();
                if (!cart.length) {
                    alert('Selectionnez au moins un produit avant de valider.');
                    return;
                }
                window.location.href = 'recapitulatif.html';
            });

            document.getElementById('back-btn').addEventListener('click', function () {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = 'livraison.html';
                }
            });

            document.getElementById('home-btn').addEventListener('click', function () {
                window.location.href = 'index.html';
            });

            document.getElementById('track-order-btn').addEventListener('click', function () {
                const status = getOrderStatus();
                alert(status === 'livree' ? 'Commande livree.' : 'Commande en cours.');
            });

            if (!localStorage.getItem('microPizzeriaToken')) {
                window.location.href = 'auth.html';
            } else {
                loadMenu();
            }
        </script>
    </body>
</html>
