<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Informations client | La Micro Pizzeria</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="order-header">
            <h1>La <span>Micro</span> Pizzeria</h1>
        </header>
        <div class="page-tools">
            <button type="button" id="back-btn">Retour page precedente</button>
            <button type="button" id="home-btn">Retour accueil</button>
            <button type="button" id="track-order-btn">Suivi de commande</button>
        </div>

        <main class="summary-page">
            <section class="summary-card">
                <p class="mini-title">Etape 1</p>
                <h2>Renseignez vos informations avant de commander</h2>

                <form id="delivery-form" class="delivery-form">
                    <label>
                        Nom complet
                        <input type="text" name="name" required>
                    </label>
                    <label>
                        Adresse
                        <input type="text" name="address" required>
                    </label>
                    <label>
                        Ville
                        <input type="text" name="city" required>
                    </label>
                    <label>
                        Code postal
                        <input type="text" name="postalCode" required>
                    </label>
                    <label>
                        Telephone
                        <input type="tel" name="phone" required>
                    </label>
                    <button type="submit">Continuer vers la commande</button>
                </form>

                <p id="delivery-message" class="item-status" aria-live="polite"></p>
            </section>
        </main>

        <script>
            const CUSTOMER_KEY = "microPizzeriaCustomer";
            const ORDER_STATUS_KEY = "microPizzeriaOrderStatus";
            const ORDER_CONFIRMED_AT_KEY = "microPizzeriaOrderConfirmedAt";

            function getOrderStatus() {
                const status = localStorage.getItem(ORDER_STATUS_KEY);
                const confirmedAt = Number(localStorage.getItem(ORDER_CONFIRMED_AT_KEY) || 0);
                if (status === "en_cours" && confirmedAt > 0 && Date.now() - confirmedAt > 60000) {
                    localStorage.setItem(ORDER_STATUS_KEY, "livree");
                    return "livree";
                }
                return status || "en_cours";
            }

            document.getElementById("delivery-form").addEventListener("submit", function (event) {
                event.preventDefault();
                const formData = new FormData(this);
                const clientName = formData.get("name");
                const customer = {
                    name: formData.get("name"),
                    address: formData.get("address"),
                    city: formData.get("city"),
                    postalCode: formData.get("postalCode"),
                    phone: formData.get("phone")
                };
                const message = "Merci " + clientName + ", vos informations sont enregistrees.";
                document.getElementById("delivery-message").textContent = message;
                localStorage.setItem(CUSTOMER_KEY, JSON.stringify(customer));
                localStorage.removeItem(ORDER_STATUS_KEY);
                localStorage.removeItem(ORDER_CONFIRMED_AT_KEY);
                setTimeout(function () {
                    window.location.href = "commande.html";
                }, 700);
            });

            document.getElementById("back-btn").addEventListener("click", function () {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = "index.html";
                }
            });

            document.getElementById("home-btn").addEventListener("click", function () {
                window.location.href = "index.html";
            });

            document.getElementById("track-order-btn").addEventListener("click", function () {
                const status = getOrderStatus();
                alert(status === "livree" ? "Commande livree." : "Commande en cours.");
            });
        </script>
    </body>
</html>
