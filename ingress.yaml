apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: micropizza-gateway
  annotations:
    # strip-api middleware (traefik-middleware.yaml), referenced as <namespace>-<name>@kubernetescrd
    # NAMESPACE is replaced by kustomization.yaml (e.g. pr-12)
    traefik.ingress.kubernetes.io/router.middlewares: NAMESPACE-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    # one host per environment: NAMESPACE.127-0-0-1.nip.io → pr-12.127-0-0-1.nip.io
    # (dashes: nip.io would read "pr-12.127.0.0.1" as the IP 12.127.0.0)
    - host: NAMESPACE.127-0-0-1.nip.io
      http:
        paths:
          # /api/users/me  → user-service sees /users/me
          # /api/auth/login → user-service sees /auth/login
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 5001
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 5001

          # /api/orders/123 → order-service sees /orders/123
          # /api/menu       → order-service sees /menu
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 5002
          - path: /api/menu
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 5002

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
