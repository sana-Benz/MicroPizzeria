apiVersion: v1 # PVC
kind: PersistentVolumeClaim
metadata:
  name: mysql-user-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1 # DEPLOYMENT
kind: Deployment
metadata:
  name: mysql-user
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-user
  template:
    metadata:
      labels:
        app: mysql-user
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: "users_db"
            - name: MYSQL_USER
              value: "micropizza"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-user-pvc
---
apiVersion: v1 # SERVICE
kind: Service
metadata:
  name: mysql-user
  namespace: default
spec:
  selector:
    app: mysql-user
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
